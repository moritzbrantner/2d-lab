name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-validation:
    name: Fast validation
    permissions:
      contents: read
      packages: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/fast-validation.yml@workflow-standard-v1.2
    with:
      bun_version: 1.3.14
      bun_cache_dependency_path: bun.lock
      cache_cargo: true
      cargo_cache_dependency_path: Cargo.lock
      format_command: bun run format:check
      typecheck_command: bun run check-types
      unit_test_command: |
        bun run test
        bun run test:rust
      pre_command: |
        rustup toolchain install stable --profile minimal
        rustup default stable
        if ! command -v wasm-pack >/dev/null 2>&1; then
          cargo install wasm-pack --version 0.14.0 --locked
        fi
      timeout_minutes: 45

  build-package:
    name: Build or reuse compiled package
    permissions:
      actions: read
      contents: read
      packages: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/build-artifact.yml@5291d5162b128faca9dd83edba24e7342730e604
    secrets: inherit
    with:
      source_sha: ${{ github.event.pull_request.head.sha || github.sha }}
      artifact_key: viz-engine-compiled-package-v1
      node_version: "24"
      bun_version: "1.3.14"
      rust_toolchain: stable
      rust_targets: wasm32-unknown-unknown
      cache_bun: true
      bun_cache_dependency_path: bun.lock
      cache_cargo: true
      cargo_cache_dependency_path: Cargo.lock
      use_environment_v1: false
      setup_command: |
        bun install --frozen-lockfile
        cargo install wasm-pack --version 0.14.0 --locked
      build_command: bun run build
      artifact_paths: |
        dist
        src/wasm/pkg
      reuse_across_runs: true
      artifact_retention_days: 14

  package-validation:
    name: Package validation
    needs: build-package
    permissions:
      actions: read
      contents: read
      packages: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/integration-validation.yml@5291d5162b128faca9dd83edba24e7342730e604
    with:
      bun_version: 1.3.14
      bun_cache_dependency_path: bun.lock
      prebuilt_artifact_run_id: ${{ needs.build-package.outputs.producer_run_id }}
      prebuilt_artifact_receipt_name: ${{ needs.build-package.outputs.receipt_artifact_name }}
      prebuilt_artifact_name: ${{ needs.build-package.outputs.artifact_name }}
      prebuilt_artifact_digest: ${{ needs.build-package.outputs.artifact_digest }}
      prebuilt_source_sha: ${{ needs.build-package.outputs.source_sha }}
      prebuilt_artifact_key: ${{ needs.build-package.outputs.artifact_key }}
      prebuilt_identity_digest: ${{ needs.build-package.outputs.identity_digest }}
      prebuilt_artifact_destination: .artifacts/viz-engine-build
      integration_command: |
        rm -rf dist src/wasm/pkg
        cp -R .artifacts/viz-engine-build/dist ./dist
        mkdir -p src/wasm
        cp -R .artifacts/viz-engine-build/src/wasm/pkg src/wasm/pkg
        bun scripts/package-smoke.mjs
      package_check_command: bun pm pack --dry-run --ignore-scripts
      timeout_minutes: 30

  charts-token:
    name: Detect charts token
    runs-on: ubuntu-latest
    outputs:
      has_token: ${{ steps.detect.outputs.has_token }}
    steps:
      - name: Detect charts repository token
        id: detect
        env:
          HAS_CHARTS_REPO_TOKEN: ${{ secrets.CHARTS_REPO_TOKEN != '' }}
        run: echo "has_token=${HAS_CHARTS_REPO_TOKEN}" >> "$GITHUB_OUTPUT"

  charts-integration:
    name: Charts integration
    needs: charts-token
    if: ${{ needs.charts-token.outputs.has_token == 'true' }}
    permissions:
      contents: read
      packages: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/integration-validation.yml@workflow-standard-v1.2
    with:
      bun_version: 1.3.14
      install_command: ""
      integration_command: |
        auth_header="$(printf 'x-access-token:%s' "$NODE_AUTH_TOKEN" | base64 -w0)"
        git -c http.extraheader="AUTHORIZATION: basic $auth_header" clone --depth=1 https://github.com/moritzbrantner/charts.git charts
        cd charts
        bun install --frozen-lockfile
        bun run build
      timeout_minutes: 30
    secrets:
      node_auth_token: ${{ secrets.CHARTS_REPO_TOKEN }}
