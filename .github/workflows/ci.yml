name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

env:
  BUN_VERSION: 1.3.14

jobs:
  verify:
    name: Verify package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout viz-engine
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git init "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          git -c http.extraheader="AUTHORIZATION: bearer $GITHUB_TOKEN" fetch --no-tags --depth=1 origin "$GITHUB_REF"
          git checkout --force FETCH_HEAD
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Set up Bun
        run: |
          curl -fsSL https://bun.sh/install | bash -s -- "bun-v$BUN_VERSION"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
          "$HOME/.bun/bin/bun" --version

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install wasm-pack
        run: |
          if ! command -v wasm-pack >/dev/null 2>&1; then
            cargo install wasm-pack --version 0.14.0 --locked
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bun run format:check

      - name: Check types
        run: bun run check-types

      - name: Run tests
        run: bun run test

      - name: Run Rust tests
        run: bun run test:rust

      - name: Build package
        run: bun run build

      - name: Check package contents
        run: bun pm pack --dry-run

  charts-integration:
    name: Charts integration
    runs-on: ubuntu-latest
    env:
      HAS_CHARTS_REPO_TOKEN: ${{ secrets.CHARTS_REPO_TOKEN != '' }}

    steps:
      - name: Skip when charts token is unavailable
        if: env.HAS_CHARTS_REPO_TOKEN != 'true'
        run: echo "Skipping charts integration because CHARTS_REPO_TOKEN is not configured."

      - name: Checkout charts
        if: env.HAS_CHARTS_REPO_TOKEN == 'true'
        env:
          CHARTS_REPO_TOKEN: ${{ secrets.CHARTS_REPO_TOKEN }}
        run: |
          git -c http.extraheader="AUTHORIZATION: bearer $CHARTS_REPO_TOKEN" clone --depth=1 https://github.com/moritzbrantner/charts.git charts

      - name: Set up Bun
        if: env.HAS_CHARTS_REPO_TOKEN == 'true'
        run: |
          curl -fsSL https://bun.sh/install | bash -s -- "bun-v$BUN_VERSION"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
          "$HOME/.bun/bin/bun" --version

      - name: Install charts dependencies
        if: env.HAS_CHARTS_REPO_TOKEN == 'true'
        working-directory: charts
        run: bun install --frozen-lockfile

      - name: Build charts
        if: env.HAS_CHARTS_REPO_TOKEN == 'true'
        working-directory: charts
        run: bun run build
