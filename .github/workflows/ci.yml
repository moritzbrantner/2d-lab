name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Verify package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout viz-engine
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/wasm-pack
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-wasm-pack-0.14.0

      - name: Install wasm-pack
        run: |
          if ! command -v wasm-pack >/dev/null 2>&1; then
            cargo install wasm-pack --version 0.14.0 --locked
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bun run format:check

      - name: Check types
        run: bun run check-types

      - name: Run tests
        run: bun run test

      - name: Run Rust tests
        run: bun run test:rust

      - name: Build package
        run: bun run build

      - name: Check npm package contents
        run: npm pack --dry-run

  charts-integration:
    name: Charts integration
    runs-on: ubuntu-latest
    env:
      HAS_CHARTS_REPO_TOKEN: ${{ secrets.CHARTS_REPO_TOKEN != '' }}

    steps:
      - name: Skip when charts token is unavailable
        if: env.HAS_CHARTS_REPO_TOKEN != 'true'
        run: echo "Skipping charts integration because CHARTS_REPO_TOKEN is not configured."

      - name: Checkout charts
        if: env.HAS_CHARTS_REPO_TOKEN == 'true'
        uses: actions/checkout@v4
        with:
          repository: moritzbrantner/charts
          token: ${{ secrets.CHARTS_REPO_TOKEN }}
          path: charts

      - name: Set up Bun
        if: env.HAS_CHARTS_REPO_TOKEN == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install charts dependencies
        if: env.HAS_CHARTS_REPO_TOKEN == 'true'
        working-directory: charts
        run: bun install --frozen-lockfile

      - name: Build charts
        if: env.HAS_CHARTS_REPO_TOKEN == 'true'
        working-directory: charts
        run: bun run build
