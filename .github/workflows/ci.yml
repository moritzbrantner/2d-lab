name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest

    steps:
      - name: Check charts repository token
        env:
          HAS_CHARTS_REPO_TOKEN: ${{ secrets.CHARTS_REPO_TOKEN != '' }}
        run: |
          if [ "$HAS_CHARTS_REPO_TOKEN" != "true" ]; then
            echo "::error::Set CHARTS_REPO_TOKEN to a token that can read moritzbrantner/charts."
            exit 1
          fi

      - name: Checkout viz-engine
        uses: actions/checkout@v4
        with:
          path: viz-engine

      - name: Checkout charts
        uses: actions/checkout@v4
        with:
          repository: moritzbrantner/charts
          token: ${{ secrets.CHARTS_REPO_TOKEN }}
          path: charts

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/wasm-pack
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-wasm-pack-0.14.0

      - name: Install wasm-pack
        run: |
          if ! command -v wasm-pack >/dev/null 2>&1; then
            cargo install wasm-pack --version 0.14.0 --locked
          fi

      - name: Install charts dependencies
        working-directory: charts
        run: bun install --frozen-lockfile

      - name: Build charts
        working-directory: charts
        run: bun run build

      - name: Install dependencies
        working-directory: viz-engine
        run: bun install --frozen-lockfile

      - name: Check formatting
        working-directory: viz-engine
        run: bun run format:check

      - name: Check types
        working-directory: viz-engine
        run: bun run check-types

      - name: Run tests
        working-directory: viz-engine
        run: bun run test

      - name: Build package
        working-directory: viz-engine
        run: bun run build
