name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - name: Generate Rust lockfile for setup repair
        run: |
          cargo generate-lockfile
          python -c 'import base64; print("CARGO_LOCK_BASE64=" + base64.b64encode(open("Cargo.lock", "rb").read()).decode())'
      - run: cargo test --workspace --locked
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo check --workspace --target wasm32-unknown-unknown --locked
      - run: bun run build
