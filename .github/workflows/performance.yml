name: Performance

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  performance-validation:
    name: Performance validation
    permissions:
      contents: read
      packages: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/performance-validation.yml@workflow-standard-v1.2
    with:
      bun_version: 1.3.14
      bun_cache_dependency_path: bun.lock
      cache_cargo: true
      cargo_cache_dependency_path: Cargo.lock
      build_command: bun run build
      benchmark_command: |
        bun run bench:quick
        bun run bench:table:supported
        bun run bench:gate
      pre_command: |
        rustup toolchain install stable --profile minimal
        rustup default stable
        if ! command -v wasm-pack >/dev/null 2>&1; then
          cargo install wasm-pack --version 0.14.0 --locked
        fi
      artifact_paths: |
        bench/results
      summary_paths: |
        bench/results/latest.md
        bench/results/performance-gate.md
      upload_artifacts_on: always
      artifact_retention_days: 30
      timeout_minutes: 60
