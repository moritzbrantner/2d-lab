name: Publish

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to npm instead of only validating the package.
        required: false
        type: boolean
        default: false
      dry_run:
        description: Run npm publish in dry-run mode when publishing manually.
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  npm-package:
    name: npm package
    permissions:
      contents: read
      id-token: write
      packages: write
    uses: moritzbrantner/reusable-workflows/.github/workflows/package-publish.yml@workflow-standard-v1.2
    with:
      package_manager: npm
      bun_version: 1.3.14
      bun_cache_dependency_path: bun.lock
      cache_bun: true
      install_command: bun install --frozen-lockfile
      pre_publish_command: |
        rustup toolchain install stable --profile minimal
        rustup default stable
        if ! command -v wasm-pack >/dev/null 2>&1; then
          cargo install wasm-pack --version 0.14.0 --locked
        fi
      validate_command: |
        bun run verify
        bun pm pack --dry-run
      publish_enabled: ${{ github.event_name == 'release' || inputs.publish == true }}
      dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}
      publish_command: |
        args=(publish --provenance --access public --ignore-scripts)
        if [ "${DRY_RUN}" = "true" ]; then
          args+=(--dry-run)
        fi
        npm "${args[@]}"
      npm_scope: "@moritzbrantner"
      npm_access: public
      npm_provenance: true
      artifact_paths: |
        dist
        src/wasm/pkg
      upload_artifacts_on: failure
      timeout_minutes: 60
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
