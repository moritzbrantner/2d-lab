name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    name: Build and deploy lab
    uses: moritzbrantner/reusable-workflows/.github/workflows/deploy-pages.yml@45042e56be120b438096e774027637cac0280075
    with:
      node_version: "24"
      bun_version: "1.4.2"
      install_command: bun install --frozen-lockfile
      pre_command: |
        rustup target add wasm32-unknown-unknown
        cargo install wasm-pack --locked --version 0.14.0
        rm -rf .github-pages-template
        git init .github-pages-template
        git -C .github-pages-template remote add origin https://github.com/moritzbrantner/github-pages-template.git
        git -C .github-pages-template fetch --depth 1 origin 7696672835b8a33eb31607ce000e650775e0f0b8
        git -C .github-pages-template checkout --detach FETCH_HEAD
      build_command: |
        bun run build:wasm
        bun run build
        node .github-pages-template/bin/github-pages-template.mjs build --config ./pages.config.json --out ./dist --augment
      artifact_path: dist
      cache_bun: true
      bun_cache_dependency_path: bun.lock
      concurrency_group: 2d-lab-pages
      cancel_in_progress: true
