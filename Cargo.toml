[workspace]
members = ["crates/viz-engine-core", "crates/viz-engine-wasm"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/moritzbrantner/viz-engine"

[workspace.dependencies]
dense-data = { path = "../rust-packages/crates/data/dense-data" }
serde = { version = "1", features = ["derive"] }
