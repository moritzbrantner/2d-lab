[package]
name = "viz-render-kernel"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Native wgpu + Vello for the oracle (`oracle/`); the browser build always has them.
native = ["dep:wgpu", "dep:vello_gpu"]

[target.'cfg(not(all(target_arch = "wasm32", target_os = "unknown")))'.dependencies]
wgpu = { version = "=30.0.1", default-features = false, features = ["wgsl"], optional = true }
vello_gpu = { git = "https://github.com/linebender/vello.git", rev = "37f7119ec7fcdc444e391867c77991887c61a652", default-features = false, features = ["wgpu"], optional = true }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
js-sys = "=0.3.107"
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "=0.4.80"
web-sys = { version = "=0.3.107", features = ["HtmlCanvasElement", "Performance", "Window"] }
wgpu = { version = "=30.0.1", default-features = false, features = ["webgpu", "wgsl"] }
vello_gpu = { git = "https://github.com/linebender/vello.git", rev = "37f7119ec7fcdc444e391867c77991887c61a652", default-features = false, features = ["wgpu"] }
